name: Turf Lab fixed October prospective cohort
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [score, capture]
        default: score
  schedule:
    - cron: '0 6 15-31 10 *'
    - cron: '0 21 15-31 10 *'
    - cron: '0 21 1-3 11 *'
  push:
    branches: [main]
    paths: ['.github/workflows/prospective_cohort.yml']
permissions:
  contents: write
concurrency:
  group: turf-october-cohort
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: turf-repository-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and bounded observation
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m unittest discover -s tests -v 2>&1 | tee reports/test_results.txt
          MODE=score
          if [ "$SCHEDULE" = '0 6 15-31 10 *' ] || [ "$REQUESTED_MODE" = capture ]; then MODE=capture; fi
          python -m scripts.prospective_cohort --mode "$MODE"
      - name: Preserve immutable captures and evidence
        if: success() || failure()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p predictions_cohort
          git add predictions_cohort evidence data reports
          if ! git diff --cached --quiet; then
            git commit -m 'Save fixed-date prospective V6 V7 observations'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/cohort_status.json
          if-no-files-found: ignore
          retention-days: 7
