name: Conditional position ranking V2
on:
  workflow_dispatch:
  push:
    branches: [research/stage-ranking-v2-evaluation]
    paths: ['.github/workflows/stage_ranking_v2.yml']
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v5.txt scipy==1.17.0
      - run: python -m unittest tests.test_stage_ranking -v
      - run: python -m scripts.train_stage_ranking_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-ranking-v2
          path: |
            reports/stage_ranking_v2/
            models/stage_ranking_v2/
      - name: Publish research evidence on the research branch
        if: github.ref_name == 'research/stage-ranking-v2-evaluation'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/stage_ranking_v2 models/stage_ranking_v2
          git commit -m 'Record conditional ranking and calibration results'
          git push origin HEAD
