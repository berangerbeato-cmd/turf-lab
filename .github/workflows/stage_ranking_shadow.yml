name: Prospective Top4 and Top5 shadow
on:
  schedule:
    - cron: '15 10 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage_ranking_shadow.yml']
permissions:
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v5.txt scipy==1.17.0
      - run: python -m unittest tests.test_stage_ranking -v
      - name: Smoke-test paired inference with the frozen model
        run: |
          python - <<'PY'
          from scripts.stage_ranking_shadow import frozen, predict
          model, _ = frozen()
          runners = [
              dict(number=n, non_runner=False, features=[None] * len(model['mean']))
              for n in range(1, 8)
          ]
          results = predict(dict(runners=runners, probabilities={n: 1/7 for n in range(1, 8)}), model)
          assert set(results) == {'4', '5'}
          for k, selections in results.items():
              assert set(selections) == {'v3', 'stage_raw'}
              for event in selections.values():
                  assert len(set(event['selection'])) == int(k)
                  assert all(0 < p < 1 for p in event['probabilities'].values())
          PY
      - name: Verify frozen models and process the prospective cohort
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m scripts.stage_ranking_shadow
      - name: Preserve forecasts and scores
        if: always()
        run: |
          if [ ! -d reports/stage_ranking_shadow ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/stage_ranking_shadow
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record prospective Top4 and Top5 shadow evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
