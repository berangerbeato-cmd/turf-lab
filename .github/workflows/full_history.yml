name: Full historical rebuild 2022-2026
on:
  workflow_dispatch:
  push:
    branches: [research/full-year-history-2022-2026]
    paths: ['.github/workflows/full_history.yml']
permissions:
  contents: write
concurrency:
  group: turf-full-history-rebuild
  cancel-in-progress: false
jobs:
  collect:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        month: ["2022-01", "2022-02", "2022-03", "2022-04", "2022-05", "2022-06", "2022-07", "2022-08", "2022-09", "2022-10", "2022-11", "2022-12", "2023-01", "2023-02", "2023-03", "2023-04", "2023-05", "2023-06", "2023-07", "2023-08", "2023-09", "2023-10", "2023-11", "2023-12", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10", "2024-11", "2024-12", "2025-11", "2025-12"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-year-history-2022-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test inventory and collector before network
        run: python -m unittest discover -s tests
      - name: Collect bounded closed month
        env:
          MONTH: ${{ matrix.month }}
        run: timeout --signal=INT --kill-after=30 75m python -m scripts.backfill_history --month "$MONTH"
      - name: Save all partial evidence on research branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/month_* evidence/month_* reports/full_history
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve bounded historical collection and quality evidence'
            git pull --rebase origin research/full-year-history-2022-2026
            git push origin HEAD:research/full-year-history-2022-2026
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-${{ matrix.month }}-${{ github.run_id }}
          path: |
            data/month_${{ matrix.month }}/manifest.json
            reports/full_history/collection_${{ matrix.month }}.json
          retention-days: 30
  audit:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-year-history-2022-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-xgboost.txt
      - run: python -m unittest discover -s tests
      - run: python -m scripts.history_inventory
      - name: Evaluate only if full historical quality gate passes
        run: |
          if test -f scripts/retest_full_history.py; then
            python -m scripts.retest_full_history
          fi
      - name: Save audit and isolated experiment
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/history_inventory.* reports/full_history
          if test -d models/full_history; then git add models/full_history; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified historical coverage and gated model comparison'
            git pull --rebase origin research/full-year-history-2022-2026
            git push origin HEAD:research/full-year-history-2022-2026
          fi
