name: Turf Lab bounded monthly history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/month_history.yml'
      - 'scripts/collect_month.py'
      - 'tests/test_month.py'
permissions:
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  month:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and collect January 2024
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m unittest discover -s tests -v 2>&1 | tee reports/test_results.txt
          python -m scripts.collect_month --month 2024-01 --max-requests 1800 --git-checkpoints
      - name: Record cloud checkpoint
        if: success() || failure()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: python -m scripts.write_cloud_checkpoint
      - name: Save completed work even after partial failure
        if: success() || failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p models
          git add evidence data models reports WORK_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve bounded monthly history and coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: month-history-diagnostic-backup
          path: |
            reports/
            data/month_2024-01/
            evidence/month_2024-01/
            models/
            WORK_PROGRESS.md
          retention-days: 7
