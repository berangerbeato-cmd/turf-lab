name: PMU one-day deep audit
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to audit (YYYY-MM-DD)'
        required: true
        default: '2026-10-05'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all trot races for one day
        run: python deep_audit.py --date '${{ inputs.date }}'
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: pmu-deep-audit
          path: data/deep_audit/
          retention-days: 90
