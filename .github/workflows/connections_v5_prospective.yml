name: Archived - Turf Lab V5 first prospective snapshots
# Archived by decision of 2026-10-17: only V6 and Classic remain active.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turf-v5-prospective
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: turf-repository-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and capture bounded future races
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m unittest discover -s tests -v 2>&1 | tee reports/test_results.txt
          python -m scripts.shadow_connections
      - name: Record progress
        if: success() || failure()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: python -m scripts.write_cloud_checkpoint
      - name: Save immutable snapshots and history
        if: success() || failure()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p predictions_v5
          git add evidence data reports predictions_v5 WORK_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint V5 prospective snapshots without refitting'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-prospective-${{ github.run_attempt }}
          path: |
            predictions_v5/
            reports/connections_v5_prospective_status.json
            data/month_2026-10/manifest.json
          retention-days: 7
