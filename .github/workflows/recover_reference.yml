name: Recover reference evidence
on:
  push:
    branches: [main]
    paths:
      - scripts/recover_reference.py
      - .github/workflows/recover_reference.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the original artifacts with digest verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/recover_reference.py
      - name: Save verified evidence permanently in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve verified PMU reference evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-reference-backup
          path: data/reference/
          retention-days: 7
