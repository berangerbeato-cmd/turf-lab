name: Turf Lab prospective V4 Speed shadow safety and score audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4_speed_shadow.yml'
      - 'turf_lab/v4_speed_shadow.py'
      - 'scripts/score_v4_speed_prospective.py'
      - 'tests/test_v4_speed_shadow.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turf-v4-speed-prospective-scorer
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing V4 scientific requirements
        run: pip install -r requirements-v5.txt scipy==1.17.0
      - name: Verify original prestart chronology and deterministic cohort
        run: |
          python -m py_compile turf_lab/v4_speed_shadow.py scripts/score_v4_speed_prospective.py
          python -m unittest tests.test_v4_speed tests.test_v4_speed_shadow -v
      - name: Initialize original prestart scorecard without retrospective replays
        run: python -m scripts.score_v4_speed_prospective
      - name: Archive prospective scorecard only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/v4_speed/prospective_scores.json
          if ! git diff --cached --quiet; then
            git commit -m 'Initialize genuine prestart V4 Speed vs V4 paired scorecard'
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
