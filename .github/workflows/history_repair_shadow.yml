name: Turf Lab history repair shadow v1 replay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history_repair_shadow.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test replay safeguards
        run: python -m unittest tests.test_history_repair_shadow -v
      - name: Reproduce original Reims prestart V3 and replay evidence
        run: |
          python -m scripts.replay_history_repair \
            --prediction predictions_operational/2026-11-21/2026-11-21_R4C5_20261121T172911422587Z/prediction.json \
            --result-file reports/manual_bets/2026-11-21_R4C5_Z4.json \
            --output reports/history_repair_shadow_v1/reims_2026-11-21_R4C5.json
      - name: Archive research-only report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/history_repair_shadow_v1
          if ! git diff --cached --quiet; then
            git commit -m 'Archive frozen prestart history repair replay for Reims'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
