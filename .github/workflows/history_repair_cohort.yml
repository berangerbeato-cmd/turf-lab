name: Turf Lab forward history-repair cohort
on:
  schedule:
    # Multiple prestart opportunities; up to ten fixed slots per run.
    # Daily frozen sample is exactly the first ten eligible French harness races.
    - cron: '10 6,8,10,12,14,16 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history_repair_cohort.yml'
      - 'scripts/capture_history_repair_prospective.py'
      - 'scripts/score_history_repair_prospective.py'
      - 'tests/test_history_repair_prospective.py'
      - 'tests/test_prospective_ten_daily.py'
      - 'turf_lab/v4_unified.py'
      - 'turf_lab/v4_full_inference.py'
      - 'scripts/score_v4_full_prospective.py'
      - 'turf_lab/v4_speed_shadow.py'
      - 'scripts/score_v4_speed_prospective.py'
      - 'tests/test_v4_speed_shadow.py'
      - 'tests/test_v4_full_inference.py'
      - 'config/v4_active.json'
      - 'turf_lab/v4_active_inference.py'
      - 'turf_lab/v4_speed_data.py'
      - 'scripts/score_v4_integrated_prospective.py'
      - 'tests/test_v4_multifeature_inference.py'
      - 'tests/test_capture_v4_context.py'
      - 'scripts/capture_v4_context.py'
      - 'turf_lab/v4_multifeature_inference.py'
      - 'turf_lab/v4_multi_features.py'
      - 'turf_lab/v4_reliability_market.py'
      - 'scripts/score_v4_prospective.py'
permissions:
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v5.txt scipy==1.17.0
      - name: Test prospective selection, provenance and result-scoring
        id: prospective_tests
        run: python -m unittest tests.test_prospective_ten_daily tests.test_history_repair_prospective tests.test_history_repair_shadow tests.test_v4_unified tests.test_score_v4_prospective tests.test_v4_full_inference tests.test_v4_speed tests.test_v4_speed_shadow tests.test_v4_multifeature tests.test_v4_multifeature_inference tests.test_capture_v4_context tests.test_v4_all_active -v
      - name: Refresh missing prior-day history before capture (bounded)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[kickoff-v4]')
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import subprocess, sys
          from turf_lab.history_sync import History
          yesterday=(datetime.now(ZoneInfo("Europe/Paris")).date()-timedelta(days=1)).isoformat()
          state=History().day(yesterday)
          if state["programme"] is None or (state["expected"] and not state["records"]):
              subprocess.run([sys.executable,"-m","scripts.sync_history","--max-requests","150"],check=True)
          else:
              print("Verified prior-day history is available:",yesterday)
          PY
      - name: Capture up to ten frozen daily harness race slots (no betting)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[kickoff-v4]')
        run: python -m scripts.capture_history_repair_prospective
      - name: Score only verified immutable prestart forecasts
        if: ${{ !cancelled() && steps.prospective_tests.outcome == 'success' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[kickoff-v4]')) }}
        run: python -m scripts.score_history_repair_prospective
      - name: Score the ONLY integrated 47-feature V4 from real prestart snapshots
        if: ${{ !cancelled() && steps.prospective_tests.outcome == 'success' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[kickoff-v4]')) }}
        run: python -m scripts.score_v4_integrated_prospective
      - name: Archive prestart evidence and paired scorecard
        if: ${{ !cancelled() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[kickoff-v4]')) }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve any bounded prior-day refresh, even if capture failed.
          git add --all -- data/history_updates evidence/history_updates reports/history_sync
          if [ -d reports/history_repair_shadow_v1/prospective_forecasts ]; then
            git add -f reports/history_repair_shadow_v1/prospective_forecasts
          fi
          if [ -f reports/history_repair_shadow_v1/prospective_scores.json ]; then
            git add -f reports/history_repair_shadow_v1/prospective_scores.json
          fi
          if [ -f reports/v4_integrated/prospective_scores.json ]; then
            git add -f reports/v4_integrated/prospective_scores.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Archive bounded forward history repair shadow cohort'
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
