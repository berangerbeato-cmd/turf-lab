name: Turf Lab bounded V5 V6 V7 six-race follow-up
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,21 14-20 10 *'
  push:
    branches: [main]
    paths: ['.github/workflows/v5_followup.yml']
permissions:
  contents: write
concurrency:
  group: turf-v5-followup
  cancel-in-progress: false
jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: turf-repository-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inference and test dependencies
        run: python -m pip install -r requirements-v5.txt scipy==1.17.0
      - name: Tests and bounded follow-up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m unittest discover -s tests -v 2>&1 | tee reports/test_results.txt
          python -m scripts.followup_connections
      - name: Save observations without model changes
        if: success() || failure()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p predictions_v5 predictions_v6 predictions_v7
          git add evidence data predictions_v5 predictions_v6 predictions_v7 reports
          if ! git diff --cached --quiet; then
            git commit -m 'Save bounded paired V3 V5 observation'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/v5_prospective_scores.json
            reports/V5_PROSPECTIVE_SCORES.md
            reports/connections_v5_prospective_status.json
            reports/v6_prospective_scores.json
            reports/V6_PROSPECTIVE_SCORES.md
            reports/v7_prospective_scores.json
            reports/V7_PROSPECTIVE_SCORES.md
          retention-days: 7
