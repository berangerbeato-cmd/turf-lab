      - name: Install free numerical dependency
        run: python -m pip install -r requirements-v5.txt
      - name: Test and evaluate frozen protocol
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/test_results.txt
          python -m scripts.backtest_connections --phase test
      - name: Record progress
        if: success() || failure()
        env:
          AUDIT_JOB_STATUS: ${{ job.status }}
        run: python -m scripts.write_cloud_checkpoint
      - name: Save evidence models and reports
        if: success() || failure()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence data models reports WORK_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint expanded V5 study'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-test-${{ github.run_attempt }}
          path: |
            reports/connections_v5_*.json
            reports/CONNECTIONS_V5_*.md
            models/connections_v5_*.json
          retention-days: 7
