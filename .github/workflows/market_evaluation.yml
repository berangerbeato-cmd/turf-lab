name: Placement and pair probability study
on:
  workflow_dispatch:
  push:
    branches: [research/full-year-history-2022-2026]
    paths: ['.github/workflows/market_evaluation.yml']
permissions:
  contents: write
concurrency:
  group: turf-market-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-year-history-2022-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-xgboost.txt
      - run: python -m unittest discover -s tests
      - run: python -m scripts.evaluate_markets
      - run: python -m scripts.calibrate_market_tickets
      - name: Preserve isolated study outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/market_evaluation
          if ! git diff --cached --quiet; then
            git commit -m 'Record placement and pair calibration study without profitability claims'
            git pull --rebase origin research/full-year-history-2022-2026
            git push origin HEAD:research/full-year-history-2022-2026
          fi
