name: Paper SG strategy comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reports/sg_ev_probability_comparison_v1/settlements/**'
      - 'turf_lab/sg_strategy_comparison.py'
      - 'tests/test_sg_strategy_comparison.py'
      - '.github/workflows/sg_strategy_comparison.yml'
permissions:
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_sg_strategy_comparison tests.test_history_venue_aliases -v
      - run: python -m scripts.score_sg_strategies
      - name: Save paper summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sg_ev_probability_comparison_v1/summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper SG comparison with evidenced settlements'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
