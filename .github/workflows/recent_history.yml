name: Refresh full-history daily results
on:
  schedule:
    - cron: '20 4 * * *'
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recent_history.yml']
permissions:
  contents: write
concurrency:
  group: turf-recent-history-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-year-history-2022-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test freshness gate
        run: python -m unittest discover -s tests -p test_recent_history.py
      - name: Collect completed days without retraining
        run: python -m scripts.refresh_recent_history
      - name: Preserve results and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- data/recent_history evidence/recent_history reports/recent_history_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified daily history; preserve frozen models'
            git pull --rebase origin research/full-year-history-2022-2026
            git push origin HEAD:research/full-year-history-2022-2026
          fi
