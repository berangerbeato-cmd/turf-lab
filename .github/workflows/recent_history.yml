name: Refresh full-history daily results
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Paris
    - cron: '30 8,12,18 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recent_history.yml']
permissions:
  contents: write
concurrency:
  group: turf-repository-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict coverage and incremental recovery
        run: python -m unittest discover -s tests -p 'test_history_sync.py'
      - name: Audit all dates and recover missing inputs only
        run: python -m scripts.sync_history --max-requests 800
      - name: Score immutable operational forecasts
        if: success() || failure()
        run: python -m scripts.score_operational
      - name: Preserve checkpoints and diagnostics even on partial results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- data/history_updates evidence/history_updates reports/history_sync reports/operational
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint incremental history and strict coverage report'
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-coverage-${{ github.run_id }}
          path: reports/history_sync/
          if-no-files-found: error
